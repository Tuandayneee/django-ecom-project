{% load static %}



<div class="sidebar-card">
    
    <div class="profile-header">
        <form id="avatar-form" method="POST" action="{% url 'update_avatar' %}" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="avatar-wrapper">
                <div class="avatar-loading" id="avatarLoading">
                    <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                </div>

                <label for="avatar-input" class="d-block w-100 h-100 m-0" style="cursor: pointer;">
                    {% if request.user.profile.profile_image %}
                        <img src="{{ request.user.profile.profile_image.url }}" class="avatar-img-circle" alt="Avatar">
                    {% else %}
                        <img src="https://ui-avatars.com/api/?name={{ request.user.username }}&background=1a1a1a&color=fff&size=128" class="avatar-img-circle" alt="Default Avatar">
                    {% endif %}

                    <div class="avatar-overlay">
                        <i class="fa-solid fa-camera text-white fs-4"></i>
                    </div>
                </label>
                <input type="file" name="profile_image" id="avatar-input" class="d-none" accept="image/*">
            </div>
        </form>

        <h6 class="fw-bold text-dark mb-1">{{ request.user.first_name }} {{ request.user.last_name }}</h6>
        <p class="text-muted small mb-0">{{ request.user.email }}</p>
    </div>

    <nav class="sidebar-menu">
        
        <a href="{% url 'user_profile' %}" class="nav-item-custom {% if active_tab == 'overview' %}active{% endif %}">
            <i class="fa-solid fa-chart-pie"></i> Tổng quan
        </a>
        
        <a href="{% url 'user_orders' %}" class="nav-item-custom {% if active_tab == 'orders' %}active{% endif %}">
            <i class="fa-solid fa-bag-shopping"></i> Đơn mua
        </a>
        
        <a href="{% url 'address_list' %}" class="nav-item-custom {% if active_tab == 'addresses' %}active{% endif %}">
            <i class="fa-solid fa-map-location-dot"></i> Sổ địa chỉ
        </a>

        <a href="{% url 'change_password' %}" class="nav-item-custom {% if active_tab == 'change_password' %}active{% endif %}">
            <i class="fa-solid fa-lock"></i> Đổi mật khẩu
        </a>
        
        <hr class="my-2 mx-3 border-light">

        <a href="{% url 'logout' %}" class="nav-item-custom text-danger">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất
        </a>

        {% if request.user.is_staff or request.user.is_superuser %}
            <a href="/admin/" target="_blank" class="nav-item-custom admin-link mt-3 justify-content-center">
                <i class="fa-solid fa-user-shield"></i> Trang Quản Trị
            </a>
        {% endif %}
    </nav>
</div>

<script src="{% static 'js/pages/user_sidebar.js' %}"></script>
