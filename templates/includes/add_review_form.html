<div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-bottom-0">
                <h5 class="modal-title fw-bold">Đánh giá sản phẩm</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body pt-0">
                <div class="d-flex align-items-center mb-4 bg-light p-3 rounded-3">
                    <img id="modalProductImg" src="" width="60" class="rounded me-3 border bg-white">
                    <div>
                        <small class="text-muted d-block">Bạn đang đánh giá:</small>
                        <h6 class="mb-0 fw-bold" id="modalProductName">...</h6>
                    </div>
                </div>

                <form id="reviewForm" method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold small text-uppercase text-muted">Mức độ hài lòng</label>
                        <div class="rate d-inline-block">
                            <input type="radio" name="rating" id="rating10" value="5" required /><label for="rating10" title="5 sao"></label>
                            <input type="radio" name="rating" id="rating8" value="4" /><label for="rating8" title="4 sao"></label>
                            <input type="radio" name="rating" id="rating6" value="3" /><label for="rating6" title="3 sao"></label>
                            <input type="radio" name="rating" id="rating4" value="2" /><label for="rating4" title="2 sao"></label>
                            <input type="radio" name="rating" id="rating2" value="1" /><label for="rating2" title="1 sao"></label>
                        </div>
                        <div style="clear: both;"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Tiêu đề đánh giá</label>
                        <select name="subject" class="form-select" required>
                            <option value="" selected disabled>-- Chọn tiêu đề --</option>
                            <option value="Tuyệt vời">Tuyệt vời - Cực kỳ hài lòng</option>
                            <option value="Rất tốt">Rất tốt - Sẽ mua lại</option>
                            <option value="Tạm ổn">Tạm ổn - Đúng với giá tiền</option>
                            <option value="Không tốt">Không tốt - Cần cải thiện</option>
                            <option value="Tệ">Tệ - Không nên mua</option>
                            <option value="Giao hàng nhanh">Giao hàng nhanh</option>
                            <option value="Đóng gói cẩn thận">Đóng gói cẩn thận</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Nội dung chi tiết</label>
                        <textarea name="review" rows="3" class="form-control" placeholder="Chia sẻ trải nghiệm..." required></textarea>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark py-2 fw-bold">Gửi đánh giá</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
