<div class="modal fade" id="addAddressModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold text-dark">
                    <i class="fa-solid fa-location-dot me-2 text-primary"></i>Thêm địa chỉ mới
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <form id="addressForm" action="{% url 'save_address' %}" method="POST">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next_url|default:'' }}">
                
                <div class="modal-body p-4" style="min-height: 450px;"> <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase text-muted">Họ và tên</label>
                            <input type="text" name="full_name" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase text-muted">Số điện thoại</label>
                            <input type="text" name="phone" class="form-control" placeholder="Ví dụ: 0912345678" required pattern="[0-9]{10}">
                        </div>
                    </div>

                    <div class="p-3 bg-light rounded-3 mb-4">
                        <label class="form-label small fw-bold text-uppercase text-muted mb-2">Khu vực nhận hàng</label>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <select id="province" class="form-select" required>
                                    <option value="">-- Tỉnh/Thành --</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <select id="district" class="form-select" disabled required>
                                    <option value="">-- Quận/Huyện --</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <select id="ward" class="form-select" disabled required>
                                    <option value="">-- Phường/Xã --</option>
                                </select>
                            </div>
                        </div>
                        
                        <input type="hidden" name="city" id="city_name"> 
                        <input type="hidden" name="state" id="district_name">
                        <input type="hidden" name="ward_name" id="ward_name">
                        <input type="hidden" name="country" value="Vietnam"> 
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase text-muted">Địa chỉ cụ thể</label>
                        <textarea name="address_line" class="form-control" rows="2" placeholder="Số nhà, tên đường, tòa nhà, khu dân cư..." required></textarea>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" name="is_default" class="form-check-input cursor-pointer" id="checkDefault">
                        <label class="form-check-label cursor-pointer user-select-none" for="checkDefault">
                            Đặt làm địa chỉ mặc định
                        </label>
                    </div>
                </div>

                <div class="modal-footer border-top-0 pt-0 pb-4 pe-4">
                    <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal">Hủy bỏ</button>
                    <button type="submit" class="btn btn-dark px-4 fw-bold">Lưu địa chỉ</button>
                </div>
            </form>
        </div>
    </div>
</div>
