{% load static %}

<div class="modal fade" id="addAddressModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      
      <div class="modal-header bg-light">
        <h5 class="modal-title fw-bold text-primary">
            <i class="fa fa-map-marker-alt me-2"></i>Thêm địa chỉ mới
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <form action="{% url 'save_address' %}" method="POST">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url|default:'' }}">
        <div class="modal-body p-4">
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Họ và tên</label>
                    <input type="text" name="full_name" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label class="form-label fw-bold">Số điện thoại</label>
                    <input type="text" name="phone" class="form-control" placeholder="Ví dụ: 0912345678" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Khu vực nhận hàng</label>
                
                <div class="row g-2">
                    <div class="col-md-4">
                        <select id="province" class="form-select" required>
                            <option value="">-- Tỉnh/Thành --</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <select id="district" class="form-select" required >
                            <option value="">-- Quận/Huyện --</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <select id="ward" class="form-select" required >
                            <option value="">-- Phường/Xã --</option>
                        </select>
                    </div>
                </div>

                <input type="hidden" name="province_id" id="province_id">
                <input type="hidden" name="district_id" id="district_id">
                <input type="hidden" name="ward_code" id="ward_code">
                
                <input type="hidden" name="city" id="full_address_str"> 
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Địa chỉ cụ thể</label>
                <textarea name="address_line" class="form-control" rows="2" placeholder="Số nhà, ngõ, tên đường, tòa nhà..." required></textarea>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" name="is_default" class="form-check-input" id="checkDefault">
                <label class="form-check-label cursor-pointer" for="checkDefault">Đặt làm địa chỉ mặc định</label>
            </div>
            
            <input type="hidden" name="next" value="{{ next_url|default:'' }}">
        </div>

        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
          <button type="submit" class="btn btn-primary px-4">Lưu địa chỉ</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js"></script>
<script src="{% static 'js/address_logic.js' %}"></script>
