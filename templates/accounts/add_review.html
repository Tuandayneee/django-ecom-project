{% extends "base/base.html" %}
{% load static %}

{% block title %}Đánh giá sản phẩm - {{ product.product_name }}{% endblock %}

{% block start %}
<section class="section-content padding-y bg-light" style="min-height: 75vh;">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-2">Đánh giá sản phẩm</h4>
                        <p class="text-muted small mb-4">
                            Đơn hàng <strong>#{{ order.order_number }}</strong> • {{ product.product_name }}
                        </p>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Số sao (1-5)</label>
                                <select name="rating" class="form-select" required>
                                    <option value="5" selected>5 sao - Tuyệt vời</option>
                                    <option value="4">4 sao - Tốt</option>
                                    <option value="3">3 sao - Tạm ổn</option>
                                    <option value="2">2 sao - Không tốt</option>
                                    <option value="1">1 sao - Tệ</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Tiêu đề đánh giá</label>
                                <input type="text" name="subject" class="form-control" maxlength="100" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Nội dung chi tiết</label>
                                <textarea name="review" rows="4" class="form-control" maxlength="500" required></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-dark px-4">Gửi đánh giá</button>
                                <a href="{% url 'order_detail' order.order_number %}" class="btn btn-outline-secondary">Quay lại</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
