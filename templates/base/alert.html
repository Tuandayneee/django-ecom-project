{% if messages %}
    <div id="message-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999; width: 300px;">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
                
                {{ message }}
                
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Tìm tất cả các alert trong container
            const alerts = document.querySelectorAll('#message-container .alert');
            
            if (alerts.length > 0) {
                // Đặt thời gian chờ (ví dụ: 4000ms = 4 giây)
                setTimeout(function() {
                    alerts.forEach(function(alert) {
                        // Cách 1: Dùng Bootstrap API (Nếu dự án có file bootstrap.js)
                        if (typeof bootstrap !== 'undefined') {
                            var bsAlert = new bootstrap.Alert(alert);
                            bsAlert.close();
                        } 
                        // Cách 2: JS thuần (Dùng cho mọi trường hợp)
                        else {
                            alert.style.transition = "opacity 0.5s ease";
                            alert.style.opacity = "0";
                            setTimeout(function() {
                                alert.remove();
                            }, 500); // Xóa khỏi DOM sau khi mờ dần
                        }
                    });
                }, 4000); 
            }
        });
    </script>
{% endif %}
